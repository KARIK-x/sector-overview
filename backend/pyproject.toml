[project]
name = "sector-intelligence"
version = "0.1.0"
description = "NEPSE Sector Intelligence - visualization-first quantitative sector analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "SQLAlchemy>=2.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "a2wsgi>=1.10",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's dependency injection requires `Depends(...)` in argument
# defaults; that is the documented idiom, not a bug.
ignore = ["E501", "B008"]
