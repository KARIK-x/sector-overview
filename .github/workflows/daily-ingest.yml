name: Daily NEPSE ingestion

on:
  schedule:
    # 09:45 UTC is 3:30 PM Nepal time, after the NEPSE close.
    # GitHub Actions can delay scheduled jobs by a few minutes.
    - cron: '45 9 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --no-cache-dir -r backend/requirements.txt
      - name: Refresh the warehouse
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/ingest.py all
